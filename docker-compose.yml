services:
  transcriptie:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    container_name: transcriptie
    env_file:
      - .env.production
    restart: unless-stopped
    # Deelt de VPS met Cyrus (mem_limit 2 GB); de app zelf heeft ruim genoeg aan dit
    mem_limit: 768m
    # Geen host-poort: alleen bereikbaar via Caddy op proxy-network
    networks:
      - proxy-network
    volumes:
      - transcriptie-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy-network:
    external: true

volumes:
  transcriptie-uploads:
